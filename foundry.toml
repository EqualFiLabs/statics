[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read-write", path = "./artifacts/diamond-manifests" },
    { access = "read", path = "./src" },
    { access = "read", path = "./test" },
    { access = "read", path = "./script" },
    { access = "read", path = "./foundry.toml" },
    { access = "read", path = "./remappings.txt" },
    { access = "read", path = "./deployments" },
    { access = "read", path = "./out" },
]

additional_compiler_profiles = [
    { name = "uniswap-position-manager", via_ir = true, optimizer_runs = 30000 },
]

compilation_restrictions = [
    { paths = "lib/v4-periphery/src/PositionManager.sol", version = "0.8.26", via_ir = true, optimizer_runs = 30000 },
    # Nested third-party permit2 contracts fail legacy codegen; interfaces stay no-IR so
    # Statics-owned importers keep the default (no_ir) profile.
    { paths = "lib/v4-periphery/lib/permit2/src/{Permit2,SignatureTransfer,AllowanceTransfer,EIP712}.sol", via_ir = true },
]

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[profile.security.fuzz]
runs = 256

[profile.security.invariant]
runs = 128
depth = 64
fail_on_revert = true
