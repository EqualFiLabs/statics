name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formal-verification:
    name: Formal verification / Halmos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize formal-verification dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/halmos-cheatcodes \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery \
            verification/doppler/vendor/doppler
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
          git -C verification/doppler/vendor/doppler submodule sync
          git -C verification/doppler/vendor/doppler submodule update --init --depth=1 \
            lib/solady \
            lib/v4-core \
            lib/v4-periphery
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Halmos
        shell: bash
        run: |
          python -m venv .halmos-venv
          .halmos-venv/bin/pip install halmos==0.3.3
          .halmos-venv/bin/halmos --version
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - name: Prove Genesis launch invariants
        env:
          HALMOS_BIN: ${{ github.workspace }}/.halmos-venv/bin/halmos
          HALMOS_THREADS: "4"
          HALMOS_LOOP_BOUND: "8"
        run: scripts/run-formal.sh all
      - name: Upload proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halmos-results
          path: formal-results/
          if-no-files-found: warn

  genesis-economics:
    name: Genesis economics / check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test simulator
        run: npm --prefix tools/genesis-economics test
      - name: Check generated reports
        run: npm --prefix tools/genesis-economics run check

  format:
    name: Solidity / format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Initialize contract dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - name: Check formatting of changed Solidity files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.sol')
          if (( ${#files[@]} == 0 )); then
            echo "No changed Solidity files to format-check."
            exit 0
          fi

          printf 'Checking %s\n' "${files[@]}"
          forge fmt --check "${files[@]}"
      - name: Check diff whitespace
        run: git diff --check

  solidity:
    name: Solidity / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize contract dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/halmos-cheatcodes \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
      - name: Normalize V4 deployment artifacts
        shell: bash
        run: |
          normalize_artifact() {
            local source="$1"
            local contract="$2"
            shift 2
            local target="out/${source}/${contract}.json"
            local profile candidate

            if [[ -f "$target" ]]; then
              echo "Using existing ${target}"
              return 0
            fi

            for profile in "$@"; do
              candidate="out/${source}/${contract}.${profile}.json"
              if [[ -f "$candidate" ]]; then
                echo "Using ${candidate} for ${target}"
                cp "$candidate" "$target"
                return 0
              fi
            done

            echo "No usable artifact found for ${contract}"
            find "out/${source}" -maxdepth 1 -type f -name "${contract}*.json" -print || true
            exit 1
          }

          normalize_artifact "PoolManager.sol" "PoolManager" "default" "uniswap-position-manager"
          normalize_artifact "Permit2.sol" "Permit2" "default" "uniswap-position-manager"
          normalize_artifact "PositionManager.sol" "PositionManager" "uniswap-position-manager" "default"
      - name: Test
        run: forge test -vv
