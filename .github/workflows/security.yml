name: Security

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-security:
    name: Security / local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize contract dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
      - name: Normalize V4 deployment artifacts
        shell: bash
        run: |
          normalize_artifact() {
            local source="$1"
            local contract="$2"
            local target="out/${source}/${contract}.json"
            mapfile -t matches < <(find out -type f -path "*/${source}/${contract}.json" -print)

            if (( ${#matches[@]} != 1 )); then
              echo "Expected exactly one ${contract} artifact, found ${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              find out -type f \( -name "${contract}.json" -o -path "*/${source}/*" \) -print
              exit 1
            fi

            if [[ "${matches[0]}" != "$target" ]]; then
              mkdir -p "out/${source}"
              cp "${matches[0]}" "$target"
            fi

            test -f "$target"
          }

          normalize_artifact "PoolManager.sol" "PoolManager"
          normalize_artifact "Permit2.sol" "Permit2"
          normalize_artifact "PositionManager.sol" "PositionManager"
      - name: Run security profile
        env:
          FOUNDRY_PROFILE: security
        run: forge test -vv

  doppler-fork:
    name: Security / Doppler fork
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_MAINNET: ${{ secrets.ROBINHOOD_MAINNET }}
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      REQUIRE_DOPPLER_FORK_PROOF: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize contract dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Require configured fork RPCs
        shell: bash
        run: |
          test -n "$ROBINHOOD_MAINNET"
          test -n "$BASE_SEPOLIA_RPC_URL"
      - name: Run Doppler fork proof
        run: forge test --match-path test/genesis/fork/DopplerGenesisLaunchFork.t.sol -vv
