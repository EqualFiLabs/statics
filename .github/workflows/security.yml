name: Security

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-security:
    name: Security / local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize contract dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build V4 test deployment artifacts
        shell: bash
        run: |
          forge build \
            lib/v4-periphery/lib/v4-core/src/PoolManager.sol \
            lib/v4-periphery/lib/permit2/src/Permit2.sol \
            lib/v4-periphery/src/PositionManager.sol

          test -f out/PoolManager.sol/PoolManager.json
          test -f out/Permit2.sol/Permit2.json
          test -f out/PositionManager.sol/PositionManager.json
      - name: Run security profile
        env:
          FOUNDRY_PROFILE: security
        run: forge test -vv

  doppler-fork:
    name: Security / Doppler fork
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_MAINNET: ${{ secrets.ROBINHOOD_MAINNET }}
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      REQUIRE_DOPPLER_FORK_PROOF: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize contract dependencies
        shell: bash
        run: |
          git submodule sync
          git submodule update --init --depth=1 \
            lib/forge-std \
            lib/openzeppelin-contracts \
            lib/openzeppelin-contracts-upgradeable \
            lib/v4-periphery
          git -C lib/v4-periphery submodule sync
          git -C lib/v4-periphery submodule update --init --depth=1 \
            lib/v4-core \
            lib/permit2
          git -C lib/v4-periphery/lib/v4-core submodule sync
          git -C lib/v4-periphery/lib/v4-core submodule update --init --depth=1 \
            lib/solmate \
            lib/openzeppelin-contracts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Require configured fork RPCs
        shell: bash
        run: |
          test -n "$ROBINHOOD_MAINNET"
          test -n "$BASE_SEPOLIA_RPC_URL"
      - name: Run Doppler fork proof
        run: forge test --match-path test/genesis/fork/DopplerGenesisLaunchFork.t.sol -vv
