<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Statics Position Avatar Lab</title>
  <style>
    :root { color-scheme: dark; --ink:#f5f7f2; --muted:#879087; --panel:#0c100d; --line:#263027; --accent:#8cff00; }
    * { box-sizing:border-box; }
    body { margin:0; background:#030504; color:var(--ink); font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    button,input,select,textarea { font:inherit; }
    header { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:18px 24px; background:#030504ee; border-bottom:1px solid var(--line); }
    h1,h2,p { margin:0; }
    h1 { font-size:16px; letter-spacing:.18em; text-transform:uppercase; }
    h2 { margin-bottom:14px; font-size:12px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }
    .tag { padding:6px 10px; color:var(--accent); border:1px solid var(--accent); }
    main { display:grid; grid-template-columns:minmax(290px,380px) minmax(560px,1fr); min-height:100vh; }
    aside { padding:24px; border-right:1px solid var(--line); }
    .stage { padding:24px; }
    .card { margin-bottom:18px; padding:18px; background:var(--panel); border:1px solid var(--line); }
    .control { display:grid; grid-template-columns:112px 1fr; align-items:center; gap:10px; margin:8px 0; }
    label { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    input,select,textarea { width:100%; color:var(--ink); background:#060806; border:1px solid #374138; border-radius:0; padding:8px; }
    button { cursor:pointer; color:#030504; background:var(--accent); border:0; padding:9px 12px; font-weight:800; text-transform:uppercase; }
    button.secondary { color:var(--ink); background:transparent; border:1px solid #4a554b; }
    .buttons { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .hero { display:grid; grid-template-columns:minmax(280px,430px) 1fr; gap:24px; align-items:start; }
    .hero-avatar { aspect-ratio:1; width:100%; background:#000; border:1px solid var(--line); }
    .hero-avatar svg { display:block; width:100%; height:100%; }
    .sizes { display:flex; align-items:end; gap:20px; margin:18px 0; }
    .size-preview { display:grid; gap:7px; color:var(--muted); font-size:10px; text-align:center; }
    .size-preview div { background:#000; border:1px solid var(--line); }
    .size-preview svg { display:block; width:100%; height:100%; }
    .traits { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .trait { padding:10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .trait b { display:block; margin-bottom:3px; color:var(--muted); font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
    .seed { overflow-wrap:anywhere; color:var(--accent); font-size:10px; }
    textarea { min-height:150px; resize:vertical; font-size:10px; }
    .sheet { display:grid; grid-template-columns:repeat(8,minmax(90px,1fr)); gap:12px; }
    .tile { background:#070907; border:1px solid var(--line); }
    .tile svg { display:block; width:100%; aspect-ratio:1; }
    .tile span { display:block; padding:5px 7px; color:var(--muted); border-top:1px solid var(--line); font-size:9px; }
    .note { color:var(--muted); font-size:11px; }
    @media (max-width:1000px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } .hero { grid-template-columns:1fr; } .sheet { grid-template-columns:repeat(4,1fr); } }
    @media (max-width:560px) { header,.stage,aside { padding:14px; } .sheet { grid-template-columns:repeat(3,1fr); gap:8px; } .control { grid-template-columns:92px 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Statics Position Avatar Lab</h1>
    <div class="tag">SVG / ONCHAIN STUDY</div>
  </header>
  <main>
    <aside>
      <section class="card">
        <h2>Position identity</h2>
        <div class="control"><label for="chainId">Chain ID</label><input id="chainId" value="46630" inputmode="numeric"></div>
        <div class="control"><label for="diamond">Diamond</label><input id="diamond" value="0x0000000000000000000000000000000000000000"></div>
        <div class="control"><label for="positionId">Position ID</label><input id="positionId" value="1" inputmode="numeric"></div>
        <div class="buttons">
          <button id="next">Next ID</button>
          <button class="secondary" id="random">Random ID</button>
        </div>
      </section>
      <section class="card">
        <h2>Trait overrides</h2>
        <div id="controls"></div>
        <div class="buttons"><button class="secondary" id="reset">Use deterministic traits</button></div>
      </section>
      <section class="card">
        <h2>Export</h2>
        <div class="buttons">
          <button id="download">Download SVG</button>
          <button class="secondary" id="copy">Copy SVG</button>
        </div>
        <p class="note" style="margin-top:12px">This is disposable visual tooling. It has no runtime or metadata dependency.</p>
      </section>
    </aside>
    <section class="stage">
      <div class="hero">
        <div>
          <div id="avatar" class="hero-avatar"></div>
          <div class="sizes">
            <div class="size-preview"><div id="p64" style="width:64px;height:64px"></div><span>64 px</span></div>
            <div class="size-preview"><div id="p128" style="width:128px;height:128px"></div><span>128 px</span></div>
            <div class="size-preview"><div id="p256" style="width:192px;height:192px"></div><span>256 px source</span></div>
          </div>
        </div>
        <div>
          <section class="card">
            <h2>Resolved identity</h2>
            <div id="traits" class="traits"></div>
            <p style="margin-top:14px"><label>Seed</label></p>
            <p id="seed" class="seed"></p>
            <p id="bytes" class="note" style="margin-top:8px"></p>
          </section>
          <section class="card">
            <h2>Raw SVG</h2>
            <textarea id="raw" readonly></textarea>
          </section>
        </div>
      </div>
      <section class="card" style="margin-top:24px">
        <h2>Deterministic contact sheet · positions 1–48</h2>
        <div id="sheet" class="sheet"></div>
      </section>
    </section>
  </main>

  const t=selected(seed,overrides),a=COLORS[t.Signal],id=bytesToHex(seed).slice(2,12);
  const art=field(t.Field,a,seed)+telemetry(t.Telemetry,a)+mantle(t.Mantle,a)+shell(t.Shell,a)+face(t.Interface,a)+sigil(t.Sigil,a)+boundary(t.Boundary,a);
  return {traits:t,svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t-${id}"><title id="t-${id}">Statics Position Avatar</title><rect width="256" height="256" fill="#030504"/>${art}</svg>`};
}
const controls=document.getElementById("controls"),overrides={};
for(const [key,values] of Object.entries(TRAITS)){
  const row=document.createElement("div");row.className="control";const lab=document.createElement("label");lab.textContent=key;const select=document.createElement("select");select.dataset.trait=key;
  select.innerHTML=`<option value="auto">Deterministic</option>`+values.map((v,i)=>`<option value="${i}">${v}</option>`).join("");select.addEventListener("change",()=>{overrides[key]=select.value;renderMain();});row.append(lab,select);controls.append(row);
}
function identity(){return {chain:document.getElementById("chainId").value||0,diamond:document.getElementById("diamond").value,id:document.getElementById("positionId").value||0};}
function renderMain(){
  const x=identity(),seed=seedFor(x.chain,x.diamond,x.id),r=svgFor(seed,overrides);
  ["avatar","p64","p128","p256"].forEach(id=>document.getElementById(id).innerHTML=r.svg);
  document.getElementById("seed").textContent=bytesToHex(seed);
  document.getElementById("bytes").textContent=`SVG bytes: ${new TextEncoder().encode(r.svg).length.toLocaleString()} · 256×256 integer-coordinate source`;
  document.getElementById("raw").value=r.svg;
  document.getElementById("traits").innerHTML=Object.entries(r.traits).map(([k,v])=>`<div class="trait"><b>${k}</b>${TRAITS[k][v]}</div>`).join("");
  document.documentElement.style.setProperty("--accent",COLORS[r.traits.Signal]);
}
function renderSheet(){
  const x=identity(),sheet=document.getElementById("sheet");sheet.innerHTML="";
  for(let id=1;id<=48;id++){const r=svgFor(seedFor(x.chain,x.diamond,id),{}),tile=document.createElement("div");tile.className="tile";tile.innerHTML=r.svg+`<span>POSITION #${id}</span>`;sheet.append(tile);}
}
function renderAll(){renderMain();renderSheet();}
document.getElementById("next").onclick=()=>{document.getElementById("positionId").value=BigInt(identity().id)+1n;renderMain();};
document.getElementById("random").onclick=()=>{document.getElementById("positionId").value=1+Math.floor(Math.random()*999999);renderMain();};
document.getElementById("reset").onclick=()=>{document.querySelectorAll("select[data-trait]").forEach(s=>{s.value="auto";overrides[s.dataset.trait]="auto";});renderMain();};
document.getElementById("download").onclick=()=>{const blob=new Blob([document.getElementById("raw").value],{type:"image/svg+xml"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`statics-position-${identity().id}.svg`;a.click();URL.revokeObjectURL(a.href);};
document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(document.getElementById("raw").value);document.getElementById("copy").textContent="Copied";setTimeout(()=>document.getElementById("copy").textContent="Copy SVG",900);};
["chainId","diamond"].forEach(id=>document.getElementById(id).addEventListener("change",renderAll));document.getElementById("positionId").addEventListener("change",renderMain);
renderAll();
</script>
</body>
